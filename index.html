<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKARI — Asian Culinary Experience</title>
<meta name="description" content="AKARI: receitas, culturas, ingredientes e técnicas da culinária do Japão, China, Coreia, Tailândia e Vietnã.">
<meta name="theme-color" content="#141414">
<meta property="og:type" content="website">
<meta property="og:title" content="AKARI — Asian Culinary Experience">
<meta property="og:description" content="Uma viagem pela essência da culinária oriental: receitas, culturas, ingredientes e técnicas.">
<meta property="og:image" content="assets/img/ramen.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Shippori+Mincho:wght@400;600;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&amp;family=Noto+Serif+Thai:wght@600&amp;display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .boot{min-height:100vh;display:grid;place-items:center;background:#141414;color:#F5F0E6;font-family:Georgia,serif;letter-spacing:.3em}
  .js-ready .boot{display:none}
</style>
</head>
<body>
<div id="root"><div class="boot" aria-hidden="true">AKARI</div></div>
<noscript>
  <div style="padding:48px 24px;background:#141414;color:#F5F0E6;font-family:Georgia,serif;text-align:center">
    <h1>AKARI — Asian Culinary Experience</h1>
    <p>Este site precisa de JavaScript ativado para navegar pelas receitas, filtros e pelo questionário.</p>
  </div>
</noscript>

<!-- Estrutura de todas as páginas. É renderizada por assets/js/runtime.js com os valores de assets/js/app.js -->
<template id="app-template">
<div class="akari">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>

<sc-if value="{{ showIntro }}" hint-placeholder-val="{{ false }}">
<div class="intro" role="presentation" onAnimationEnd="{{ introEnd }}">
  <div class="intro-in">
    <div class="seal" aria-hidden="true">灯</div>
    <div class="intro-word" aria-hidden="true"><span>A</span><span>K</span><span>A</span><span>R</span><span>I</span></div>
    <div class="intro-line"></div>
    <p class="intro-sub">Asian Culinary Experience</p>
  </div>
  <button class="intro-skip" type="button" onClick="{{ skipIntro }}">Pular introdução</button>
</div>
</sc-if>

<header class="hdr">
  <div class="wrap hdr-in">
    <button class="brand" type="button" onClick="{{ nav.home }}" aria-label="AKARI — ir para o início">
      <span class="seal" aria-hidden="true">灯</span>
      <span class="word"><b>AKARI</b><small>Asian Culinary Experience</small></span>
    </button>
    <nav class="nav" aria-label="Principal">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="8">
        <button class="nav-a {{ n.cls }}" type="button" onClick="{{ n.go }}" aria-current="{{ n.current }}">{{ n.label }}</button>
      </sc-for>
    </nav>
    <button class="burger" type="button" onClick="{{ openMenu }}" aria-label="Abrir menu" aria-expanded="{{ menuOpen }}" aria-controls="menu-movel"><span></span></button>
  </div>
  <div class="progress" aria-hidden="true"></div>
</header>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div class="mnav" id="menu-movel" role="dialog" aria-modal="true" aria-label="Menu" onKeyDown="{{ menuKey }}">
  <div class="mnav-top">
    <span class="brand"><span class="seal" aria-hidden="true">灯</span><span class="word"><b>AKARI</b><small>Asian Culinary Experience</small></span></span>
    <button class="mclose" type="button" onClick="{{ closeMenu }}" aria-label="Fechar menu" ref="{{ menuCloseRef }}">×</button>
  </div>
  <ul class="mlist">
    <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="8">
      <li><button class="mlink {{ n.cls }}" type="button" onClick="{{ n.go }}" aria-current="{{ n.current }}" style="animation-delay: {{ n.delay }}ms"><small>{{ n.no }}</small>{{ n.label }}</button></li>
    </sc-for>
  </ul>
  <p class="mnote">AKARI é uma marca fictícia de demonstração. Receitas e conteúdos são reais e testáveis em casa.</p>
</div>
</sc-if>

<aside class="rail" aria-hidden="true">
  <span class="rail-k">{{ railKanji }}</span>
  <span class="rail-line"><i></i></span>
  <span class="rail-t">{{ railLabel }}</span>
</aside>

<main id="conteudo" tabindex="-1">

<!-- ============ INÍCIO ============ -->
<sc-if value="{{ is.home }}" hint-placeholder-val="{{ true }}">
<div class="page">
  <section class="hero dk" aria-labelledby="hero-t">
    <div class="hero-k" aria-hidden="true">灯</div>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow rise"><span class="dot"></span>Asian Culinary Experience <span class="jp">東洋の味</span></p>
        <h1 class="hero-title" id="hero-t"><span class="ln"><span>Uma viagem pela</span></span><span class="ln"><span><em>essência</em> da</span></span><span class="ln"><span>culinária oriental.</span></span></h1>
        <p class="lead rise d3">Receitas testadas, histórias de mesa e técnicas de cinco cozinhas asiáticas — do caldo de ramen que ferve por oito horas ao matcha batido em quinze segundos. Para quem cozinha com curiosidade.</p>
        <div class="btns rise d4">
          <button class="btn" type="button" onClick="{{ nav.destaques }}"><span>Explorar sabores</span><span class="arr" aria-hidden="true">→</span></button>
          <button class="btn ghost" type="button" onClick="{{ nav.receitas }}"><span>Descobrir receitas</span></button>
        </div>
        <p class="hero-quote rise d5"><span class="rule"></span>Tradições milenares. Experiências inesquecíveis.</p>
      </div>
      <div class="hero-visual">
        <svg class="enso" viewBox="0 0 600 600" aria-hidden="true">
          <defs><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="10"></feDisplacementMap></filter></defs>
          <path d="M175 516.5 A250 250 0 1 1 278.2 549" pathLength="1" stroke="#D93825" stroke-width="16" filter="url(#ink)" opacity="0.9"></path>
          <path d="M190 528 A262 262 0 1 1 300 562" pathLength="1" stroke="#C5A46D" stroke-width="2" opacity="0.55"></path>
        </svg>
        <div class="hero-plate ph"><img src="assets/img/ramen.svg" alt="Tigela de ramen tonkotsu vista de cima, com chashu, ovo marinado, nori, naruto e cebolinha" width="800" height="800" decoding="async"></div>
        <svg class="steam" viewBox="0 0 200 200" aria-hidden="true">
          <path d="M60 190 C40 150 90 130 70 90 C55 60 85 40 75 10"></path>
          <path d="M110 190 C90 150 140 130 120 90 C105 60 135 40 125 10"></path>
          <path d="M150 190 C130 150 170 140 160 100"></path>
        </svg>
        <button class="hero-cap" type="button" onClick="{{ openRamen }}"><span class="dotr" aria-hidden="true"></span><span><small>No prato · Japão</small><span>Ramen tonkotsu</span></span></button>
      </div>
    </div>
    <button class="scue" type="button" onClick="{{ scrollNext }}" aria-label="Rolar para a próxima seção">Role<i></i></button>
  </section>

  <section class="sec lt" id="home-next" aria-labelledby="cuis-t">
    <div class="wrap">
      <div class="sec-head row rv">
        <div class="stack">
          <p class="kicker"><span class="num">01</span>Cinco cozinhas</p>
          <h2 class="h2" id="cuis-t">Descubra a Ásia em cada sabor — <em class="acc">sem tratá-la como uma só.</em></h2>
        </div>
        <p class="lead" style="max-width: 420px">Cada país tem sua própria gramática de sabor. Escolha por onde começar a viagem.</p>
      </div>
      <div class="cuis rv">
        <sc-for list="{{ countries }}" as="c" hint-placeholder-count="5">
          <button class="cui" type="button" onClick="{{ c.goCulture }}">
            <span class="n">{{ c.no }}</span>
            <span class="nat" lang="{{ c.lang }}">{{ c.native }}</span>
            <span class="nm">{{ c.name }}</span>
            <p>{{ c.motto }}</p>
            <span class="go">Conhecer a cozinha <span aria-hidden="true">→</span></span>
          </button>
        </sc-for>
      </div>
    </div>
  </section>

  <section class="sec dk" aria-labelledby="pop-t">
    <div class="wrap">
      <div class="sec-head row rv">
        <div class="stack">
          <p class="kicker"><span class="num">02</span>Receitas populares</p>
          <h2 class="h2" id="pop-t">As mais preparadas pela nossa comunidade</h2>
        </div>
        <button class="link" type="button" onClick="{{ nav.receitas }}">Ver todas as {{ recipeCount }} receitas <span aria-hidden="true">→</span></button>
      </div>
      <div class="rgrid four">
        <sc-for list="{{ popular }}" as="r" hint-placeholder-count="4">
          <article class="rcard rv">
            <div class="ph"><img src="{{ r.img }}" alt="{{ r.alt }}" width="800" height="800" loading="lazy" decoding="async"></div>
            <div class="tags"><span class="tag">{{ r.catLabel }}</span></div>
            <div class="body">
              <span class="origin">{{ r.countryName }}</span>
              <h3>{{ r.title }}</h3>
              <p>{{ r.desc }}</p>
              <div class="foot">
                <div class="meta">
                  <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ r.timeLabel }}</span>
                  <span><span class="diff" aria-hidden="true"><i class="{{ r.d1 }}"></i><i class="{{ r.d2 }}"></i><i class="{{ r.d3 }}"></i></span>{{ r.diffLabel }}</span>
                </div>
                <button class="link" type="button" onClick="{{ r.open }}" aria-label="Ver receita: {{ r.title }}">Ver receita</button>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </section>

  <section class="sec lt" aria-labelledby="season-t">
    <div class="wrap">
      <div class="sec-head rv">
        <p class="kicker"><span class="num">03</span>Escolhas do chef · Outubro</p>
        <h2 class="h2" id="season-t">Outono na Ásia, primavera no Brasil</h2>
        <svg class="brush" viewBox="0 0 180 14" aria-hidden="true"><path d="M3 9 C 50 3, 120 14, 177 5" pathLength="1"></path></svg>
      </div>
      <div class="season">
        <button class="s-main par rv" type="button" onClick="{{ season.main.open }}" style="border: 0; padding: 0; text-align: left">
          <div class="ph"><img src="{{ season.main.img }}" alt="{{ season.main.alt }}" width="800" height="800" loading="lazy" decoding="async"></div>
          <div class="cap">
            <span class="kicker" style="color: #C5A46D">Recomendação principal</span>
            <h3 class="h2" style="font-size: clamp(30px, 3.4vw, 46px)">{{ season.main.title }}</h3>
            <p>{{ season.main.why }}</p>
            <span class="link" style="color: #F5F0E6">Ver receita <span aria-hidden="true">→</span></span>
          </div>
        </button>
        <div class="s-side">
          <sc-for list="{{ season.side }}" as="s" hint-placeholder-count="2">
            <button class="s-item rv" type="button" onClick="{{ s.open }}">
              <div class="ph"><img src="{{ s.img }}" alt="{{ s.alt }}" width="800" height="800" loading="lazy" decoding="async"></div>
              <div>
                <span class="why">{{ s.tag }}</span>
                <h3>{{ s.title }}</h3>
                <p>{{ s.why }}</p>
              </div>
            </button>
          </sc-for>
          <p class="s-note rv">“A estação decide o cardápio antes de nós. Cozinhar a Ásia no Brasil é traduzir esse calendário para os ingredientes daqui.”</p>
        </div>
      </div>
    </div>
  </section>

  <section class="band" aria-labelledby="band-t">
    <div class="wrap band-in">
      <div class="rv">
        <p class="kicker" style="color: #FFE9E3">Experiência interativa</p>
        <h2 id="band-t" style="margin-top: 14px">Qual sabor oriental combina com você?</h2>
        <p>Cinco perguntas rápidas sobre intensidade, pimenta, temperatura, proteína e tempo. No fim, três pratos escolhidos para o seu paladar — com o porquê de cada um.</p>
      </div>
      <div class="band-r rv">
        <div class="band-steps" aria-hidden="true"><span>5 perguntas</span><span>1 minuto</span><span>3 recomendações</span></div>
        <button class="btn" type="button" onClick="{{ nav.experiencia }}"><span>Fazer o teste</span><span class="arr" aria-hidden="true">→</span></button>
      </div>
    </div>
  </section>

  <section class="sec dk seigaiha" aria-labelledby="facts-t">
    <div class="wrap">
      <div class="sec-head rv">
        <p class="kicker"><span class="num">04</span>Curiosidades culturais</p>
        <h2 class="h2" id="facts-t">Muito além da receita, uma viagem cultural</h2>
        <p class="lead">Toque em cada cartão para revelar a história por trás do costume.</p>
      </div>
      <div class="facts">
        <sc-for list="{{ facts }}" as="f" hint-placeholder-count="5">
          <button class="fact rv {{ f.cls }}" type="button" onClick="{{ f.toggle }}" aria-expanded="{{ f.on }}">
            <span class="fk" lang="{{ f.lang }}">{{ f.k }}</span>
            <span class="fc">{{ f.country }}</span>
            <h3>{{ f.q }}</h3>
            <sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}"><p class="ans">{{ f.a }}</p></sc-if>
            <span class="hint"><b aria-hidden="true">+</b>{{ f.hint }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </section>

  <section class="sec lt" aria-labelledby="news-t">
    <div class="wrap news">
      <div class="rv" style="display: flex; flex-direction: column; gap: 18px">
        <p class="kicker"><span class="num">05</span>Newsletter</p>
        <h2 class="h2" id="news-t">Uma receita por semana, com a história que vem junto.</h2>
        <p class="lead">Toda quinta: um prato, um ingrediente explicado e uma técnica para praticar no fim de semana.</p>
      </div>
      <div class="rv">
        <sc-if value="{{ news.done }}" hint-placeholder-val="{{ false }}">
          <div class="ok-box" role="status">
            <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            <div><h3>Inscrição validada</h3><p>O e-mail {{ news.email }} está correto. Esta é uma demonstração sem servidor: nenhum dado foi enviado ou armazenado.</p>
            <button class="link" type="button" onClick="{{ news.reset }}" style="margin-top: 8px">Inscrever outro e-mail</button></div>
          </div>
        </sc-if>
        <sc-if value="{{ news.form }}" hint-placeholder-val="{{ true }}">
          <form class="nform" onSubmit="{{ news.submit }}" aria-label="Inscrição na newsletter">
            <div class="nrow">
              <div class="field">
                <label for="nl-home">Seu melhor e-mail</label>
                <input class="inp {{ news.cls }}" id="nl-home" type="text" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" value="{{ news.email }}" onChange="{{ news.change }}" aria-invalid="{{ news.invalid }}" aria-describedby="nl-home-err">
              </div>
              <button class="btn" type="submit" style="align-self: flex-end"><span>Inscrever</span></button>
            </div>
            <sc-if value="{{ news.error }}" hint-placeholder-val="{{ false }}"><p class="err" id="nl-home-err" role="alert">{{ news.error }}</p></sc-if>
            <p class="demo-note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Demonstração: o formato do e-mail é validado no navegador, mas não há envio real.</p>
          </form>
        </sc-if>
      </div>
    </div>
  </section>
</div>
</sc-if>

<!-- ============ RECEITAS ============ -->
<sc-if value="{{ is.receitas }}" hint-placeholder-val="{{ false }}">
<div class="page">
  <section class="phead lt" aria-labelledby="rec-t">
    <div class="big-k" aria-hidden="true">食</div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Você está em"><ol><li><button type="button" onClick="{{ nav.home }}">Início</button></li><li><span aria-current="page">Receitas</span></li></ol></nav>
      <div class="phead-in">
        <p class="kicker rise">Catálogo de receitas</p>
        <h1 class="h1 title-rev" id="rec-t">Cada prato conta uma história.</h1>
        <p class="lead rise d2">{{ recipeCount }} receitas de cinco países, escritas para a cozinha de casa — com quantidades, tempos reais e o conselho do chef que costuma faltar nos livros.</p>
      </div>
    </div>
  </section>

  <div class="filters lt" role="search" aria-label="Filtrar receitas">
    <div class="wrap">
      <div class="f-row">
        <div class="search">
          <label class="sr" for="busca">Buscar receita pelo nome</label>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input class="inp" id="busca" type="search" placeholder="Buscar por nome, país ou ingrediente…" value="{{ f.q }}" onChange="{{ f.setQ }}" autocomplete="off">
        </div>
        <div class="f-sel">
          <label class="sr" for="f-diff">Dificuldade</label>
          <select class="inp" id="f-diff" value="{{ f.diff }}" onChange="{{ f.setDiff }}">
            <option value="all">Toda dificuldade</option>
            <option value="1">Fácil</option>
            <option value="2">Média</option>
            <option value="3">Avançada</option>
          </select>
        </div>
        <div class="f-sel">
          <label class="sr" for="f-time">Tempo de preparo</label>
          <select class="inp" id="f-time" value="{{ f.time }}" onChange="{{ f.setTime }}">
            <option value="all">Qualquer tempo</option>
            <option value="30">Até 30 min</option>
            <option value="60">30 a 60 min</option>
            <option value="61">Mais de 1 hora</option>
          </select>
        </div>
      </div>
      <div class="f-row">
        <div class="cats" role="group" aria-label="Categorias">
          <sc-for list="{{ f.cats }}" as="c" hint-placeholder-count="9">
            <button class="chip {{ c.cls }}" type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}">{{ c.label }}</button>
          </sc-for>
        </div>
      </div>
      <div class="f-row" style="justify-content: space-between">
        <p class="count" aria-live="polite"><b>{{ f.count }}</b> {{ f.countLabel }}</p>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
          <sc-if value="{{ f.countryOn }}" hint-placeholder-val="{{ false }}">
            <button class="chip on" type="button" onClick="{{ f.clearCountry }}" aria-label="Remover filtro de país: {{ f.countryName }}">País: {{ f.countryName }} <span class="x" aria-hidden="true">×</span></button>
          </sc-if>
          <sc-if value="{{ f.any }}" hint-placeholder-val="{{ false }}">
            <button class="link" type="button" onClick="{{ f.clear }}">Limpar filtros</button>
          </sc-if>
        </div>
      </div>
    </div>
  </div>

  <section class="sec lt" style="padding-top: 40px" aria-label="Resultados">
    <div class="wrap">
      <div class="rgrid {{ f.gridCls }}">
        <sc-for list="{{ f.results }}" as="r" hint-placeholder-count="6">
          <article class="rcard">
            <div class="ph"><img src="{{ r.img }}" alt="{{ r.alt }}" width="800" height="800" loading="lazy" decoding="async"></div>
            <div class="tags"><span class="tag">{{ r.catLabel }}</span></div>
            <div class="body">
              <span class="origin">{{ r.countryName }}</span>
              <h3>{{ r.title }}</h3>
              <p>{{ r.desc }}</p>
              <div class="foot">
                <div class="meta">
                  <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ r.timeLabel }}</span>
                  <span><span class="diff" aria-hidden="true"><i class="{{ r.d1 }}"></i><i class="{{ r.d2 }}"></i><i class="{{ r.d3 }}"></i></span>{{ r.diffLabel }}</span>
                </div>
                <button class="btn sm" type="button" onClick="{{ r.open }}" aria-label="Ver receita: {{ r.title }}"><span>Ver receita</span></button>
              </div>
            </div>
          </article>
        </sc-for>
        <sc-if value="{{ f.empty }}" hint-placeholder-val="{{ false }}">
          <div class="empty" role="status">
            <svg viewBox="0 0 120 120" aria-hidden="true"><path d="M30 92 A40 40 0 1 1 88 96" fill="none" stroke="#B42C1B" stroke-width="7" stroke-linecap="round"></path><path d="M44 60h32" stroke="#7A5B28" stroke-width="3" stroke-linecap="round"></path></svg>
            <h3>Nenhuma receita encontrada</h3>
            <p class="lead">{{ f.emptyMsg }}</p>
            <button class="btn" type="button" onClick="{{ f.clear }}"><span>Limpar filtros e ver todas</span></button>
          </div>
        </sc-if>
      </div>
    </div>
  </section>
</div>
</sc-if>

<!-- ============ CULTURAS ============ -->
<sc-if value="{{ is.culturas }}" hint-placeholder-val="{{ false }}">
<div class="page">
  <section class="phead dk" aria-labelledby="cul-t">
    <div class="big-k" aria-hidden="true">文</div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Você está em"><ol><li><button type="button" onClick="{{ nav.home }}">Início</button></li><li><span aria-current="page">Países e culturas</span></li></ol></nav>
      <div class="phead-in">
        <p class="kicker rise">Países e culturas</p>
        <h1 class="h1 title-rev" id="cul-t">Cinco mesas, cinco maneiras de pensar o sabor.</h1>
        <p class="lead rise d2">Fermentação coreana, a subtração japonesa, o equilíbrio tailandês, o frescor vietnamita e as muitas Chinas que cabem num wok. Escolha um país.</p>
      </div>
    </div>
  </section>
  <section class="sec dk" style="padding-top: 0">
    <div class="wrap">
      <div class="ctabs" role="tablist" aria-label="Países">
        <sc-for list="{{ countries }}" as="c" hint-placeholder-count="5">
          <button class="ctab {{ c.tabCls }}" type="button" role="tab" id="tab-{{ c.id }}" aria-selected="{{ c.selected }}" aria-controls="painel-pais" tabindex="{{ c.tabIndex }}" onClick="{{ c.pick }}" onKeyDown="{{ c.tabKey }}">
            <span class="nat" lang="{{ c.lang }}">{{ c.native }}</span>
            <span>{{ c.name }}</span>
          </button>
        </sc-for>
      </div>
      <div class="cpanel {{ cc.anim }}" id="painel-pais" role="tabpanel" aria-labelledby="tab-{{ cc.id }}">
        <div class="cvis">
          <div class="ph"><img src="{{ cc.img }}" alt="{{ cc.alt }}" width="800" height="800" decoding="async"></div>

      <div class="ab-hero">
        <div class="phead-in">
          <p class="kicker rise">Sobre a AKARI</p>
          <h1 class="h1 title-rev" id="sob-t">Akari, <span lang="ja">灯</span>: a luz que se acende sobre a mesa.</h1>
          <p class="lead rise d2">Em japonês, <i>akari</i> é a luz suave de uma lanterna — aquela que não ofusca, apenas revela. É o que queremos fazer com a cozinha asiática: iluminar o que já está lá, com respeito pela origem de cada prato.</p>
          <p class="lead rise d3">A AKARI nasceu de cadernos de viagem cheios de receitas anotadas à mão, perguntas feitas em bancas de rua e muitas tentativas na cozinha de casa até que o caldo ficasse certo.</p>
        </div>
        <div class="ab-col rise d3" aria-hidden="true">
          <div class="ph a1"><img src="assets/img/matcha.svg" alt="" width="800" height="800" loading="lazy"></div>
          <div class="ph a2"><img src="assets/img/jiaozi.svg" alt="" width="800" height="800" loading="lazy"></div>
          <div class="ph a3"><img src="assets/img/i-sesame.svg" alt="" width="800" height="800" loading="lazy"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec dk2" aria-labelledby="man-t">
    <div class="wrap">
      <p class="kicker rv" id="man-t" style="margin-bottom: 36px">Manifesto</p>
      <div class="manifesto">
        <p class="rv">Acreditamos que uma receita é <em>um documento cultural</em>, <span>não um atalho.</span></p>
        <p class="rv">Que o dashi merece os seus vinte minutos. <span>Que o kimchi precisa de tempo. Que o curry começa no pilão.</span></p>
        <p class="rv">Que a Ásia não cabe numa palavra só — <span>e que cada cozinha deve ser chamada pelo próprio nome.</span></p>
        <p class="rv">E que cozinhar é a forma mais saborosa de <em>viajar sem sair de casa.</em></p>
      </div>
    </div>
  </section>

  <section class="sec lt" aria-labelledby="val-t">
    <div class="wrap">
      <div class="sec-head rv">
        <p class="kicker"><span class="num">01</span>Valores</p>
        <h2 class="h2" id="val-t">O que guia cada página que publicamos</h2>
      </div>
      <div class="values rv">
        <div class="val"><span class="vk" aria-hidden="true">源</span><h3>Origem com nome</h3><p>Dizemos de onde o prato vem, qual região o criou e o que mudou na adaptação. Japonês é japonês; coreano é coreano.</p></div>
        <div class="val"><span class="vk" aria-hidden="true">技</span><h3>Técnica antes de truque</h3><p>Explicamos o porquê de cada etapa — lavar o arroz, quebrar o coco, escaldar o tofu — para que você cozinhe com autonomia.</p></div>
        <div class="val"><span class="vk" aria-hidden="true">季</span><h3>A estação como guia</h3><p>As escolhas do chef seguem o calendário: o da Ásia, e o da feira brasileira onde você vai comprar os ingredientes.</p></div>
        <div class="val"><span class="vk" aria-hidden="true">卓</span><h3>Mesa compartilhada</h3><p>Banchan, dim sum, rolinhos para enrolar à mesa: grande parte dessas cozinhas foi feita para dividir. Nossas receitas também.</p></div>
      </div>
    </div>
  </section>

  <section class="sec dk" aria-labelledby="phi-t">
    <div class="wrap philo">
      <div class="ph par rv"><img src="assets/img/sashimi.svg" alt="Prato escuro com fatias de sashimi de salmão e atum, folha de shissô e daikon" width="800" height="800" loading="lazy" decoding="async"></div>
      <div class="txt rv">
        <p class="kicker"><span class="num">02</span>Filosofia gastronômica</p>
        <h2 class="h2" id="phi-t">Equilíbrio, não excesso.</h2>
        <p class="lead">A culinária japonesa fala em <i>go mi</i>, os cinco sabores; a tailandesa busca o ponto em que doce, azedo, salgado e picante se sustentam; a chinesa organiza o prato em harmonia de cores, aromas e texturas. Línguas diferentes para uma mesma ideia: nenhum elemento deve gritar sozinho.</p>
        <p class="lead">Por isso nossas receitas indicam onde provar, o que ajustar e quando parar.</p>
        <blockquote>“Prove. Ajuste. Prove de novo. A receita termina na sua língua, não no papel.”</blockquote>
      </div>
    </div>
  </section>

  <section class="sec lt" aria-labelledby="tl-t">
    <div class="wrap">
      <div class="sec-head rv">
        <p class="kicker"><span class="num">03</span>Linha do tempo</p>

              <div class="field">
                <label for="c-email">E-mail</label>
                <input class="inp {{ c.cls.email }}" id="c-email" name="email" type="text" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" value="{{ c.v.email }}" onChange="{{ c.on.email }}" onBlur="{{ c.blur.email }}" aria-invalid="{{ c.inv.email }}" aria-describedby="c-email-err">
                <sc-if value="{{ c.e.email }}" hint-placeholder-val="{{ false }}"><p class="err" id="c-email-err">{{ c.e.email }}</p></sc-if>
              </div>
            </div>
            <div class="field">
              <label for="c-subject">Assunto</label>
              <select class="inp {{ c.cls.subject }}" id="c-subject" name="subject" value="{{ c.v.subject }}" onChange="{{ c.on.subject }}" onBlur="{{ c.blur.subject }}" aria-invalid="{{ c.inv.subject }}" aria-describedby="c-subject-err">
                <option value="">Selecione um assunto</option>
                <option value="receita">Dúvida sobre uma receita</option>
                <option value="sugestao">Sugestão de prato ou país</option>
                <option value="parceria">Parcerias e eventos</option>
                <option value="imprensa">Imprensa</option>
                <option value="outro">Outro assunto</option>
              </select>
              <sc-if value="{{ c.e.subject }}" hint-placeholder-val="{{ false }}"><p class="err" id="c-subject-err">{{ c.e.subject }}</p></sc-if>
            </div>
            <div class="field">
              <label for="c-msg">Mensagem</label>
              <textarea class="inp {{ c.cls.message }}" id="c-msg" name="message" placeholder="Conte o que você está cozinhando…" value="{{ c.v.message }}" onChange="{{ c.on.message }}" onBlur="{{ c.blur.message }}" aria-invalid="{{ c.inv.message }}" aria-describedby="c-msg-err c-msg-hint"></textarea>
              <div class="hint" id="c-msg-hint"><span>Mínimo de 20 caracteres.</span><span>{{ c.msgLen }}/1200</span></div>
              <sc-if value="{{ c.e.message }}" hint-placeholder-val="{{ false }}"><p class="err" id="c-msg-err">{{ c.e.message }}</p></sc-if>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
              <p class="demo-note" style="max-width: 360px"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>Demonstração sem servidor: a validação é real, o envio não acontece.</p>
              <button class="btn" type="submit"><span>Validar e enviar</span><span class="arr" aria-hidden="true">→</span></button>
            </div>
          </form>
        </sc-if>
      </div>
      <div class="aside">
        <div class="acard seigaiha">
          <p class="kicker">Newsletter</p>
          <h2>Uma receita por semana</h2>
          <p class="muted" style="font-size: 15px">Toda quinta, um prato com sua história, um ingrediente explicado e uma técnica para praticar.</p>
          <sc-if value="{{ news.done }}" hint-placeholder-val="{{ false }}">
            <div class="ok-box" role="status"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><div><h3>Inscrição validada</h3><p>Demonstração: nenhum dado foi enviado ou armazenado.</p><button class="link" type="button" onClick="{{ news.reset }}">Usar outro e-mail</button></div></div>
          </sc-if>
          <sc-if value="{{ news.form }}" hint-placeholder-val="{{ true }}">
            <form class="nform" onSubmit="{{ news.submit }}" aria-label="Inscrição na newsletter">
              <div class="field">
                <label for="nl-ct">E-mail</label>
                <input class="inp {{ news.cls }}" id="nl-ct" type="text" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com" value="{{ news.email }}" onChange="{{ news.change }}" aria-invalid="{{ news.invalid }}" aria-describedby="nl-ct-err">
              </div>
              <label class="chk"><input type="checkbox" checked="{{ news.consent }}" onChange="{{ news.toggleConsent }}"><span>Aceito receber e-mails da AKARI e sei que posso cancelar quando quiser.</span></label>
              <sc-if value="{{ news.error }}" hint-placeholder-val="{{ false }}"><p class="err" id="nl-ct-err" role="alert">{{ news.error }}</p></sc-if>
              <button class="btn" type="submit"><span>Inscrever</span></button>
            </form>
          </sc-if>
        </div>
        <div class="acard" style="background: #242424">
          <p class="kicker">Redes sociais</p>
          <p class="muted" style="font-size: 14px">Perfis demonstrativos: a AKARI é uma marca fictícia, então estes endereços ainda não existem.</p>
          <div class="social">
            <span class="soc"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="3.6"></circle><path d="M17 7.2h.01"></path></svg></i>Instagram · @akari.cozinha</span>
            <span class="soc"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="M10.5 9.5v5l4-2.5z"></path></svg></i>YouTube · AKARI Cozinha</span>
            <span class="soc"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="6"></circle><path d="M11 13l-2 8"></path></svg></i>Pinterest · akaricozinha</span>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
</sc-if>

<!-- ============ 404 ============ -->
<sc-if value="{{ is.notfound }}" hint-placeholder-val="{{ false }}">
<div class="page">
  <section class="nf dk seigaiha" aria-labelledby="nf-t">
    <div class="nf-in wrap">
      <span class="num" aria-hidden="true">404</span>
      <p class="kicker">Página não encontrada</p>
      <h1 class="h2" id="nf-t">Este prato saiu do cardápio.</h1>
      <p class="lead">O endereço “{{ badPath }}” não existe por aqui. Que tal voltar à cozinha?</p>
      <div class="btns" style="justify-content: center">
        <button class="btn" type="button" onClick="{{ nav.home }}"><span>Voltar ao início</span></button>
        <button class="btn ghost" type="button" onClick="{{ nav.receitas }}"><span>Ver receitas</span></button>
      </div>
    </div>
  </section>
</div>
</sc-if>

</main>

<footer class="ftr">
  <div class="wrap">
    <div class="ftr-top">
      <div>
        <button class="brand" type="button" onClick="{{ nav.home }}" aria-label="AKARI — ir para o início"><span class="seal" aria-hidden="true">灯</span><span class="word"><b>AKARI</b><small>Asian Culinary Experience</small></span></button>
        <h2>A luz que revela o sabor.</h2>
        <p>Receitas, culturas e técnicas do Japão, da China, da Coreia, da Tailândia e do Vietnã — escritas para a cozinha de casa.</p>
      </div>
      <div>
        <h3>Explorar</h3>
        <ul>
          <li><button type="button" onClick="{{ nav.receitas }}">Receitas</button></li>
          <li><button type="button" onClick="{{ nav.destaques }}">Pratos em destaque</button></li>
          <li><button type="button" onClick="{{ nav.culturas }}">Países e culturas</button></li>
          <li><button type="button" onClick="{{ nav.ingredientes }}">Ingredientes e técnicas</button></li>
        </ul>
      </div>
      <div>
        <h3>AKARI</h3>
        <ul>
          <li><button type="button" onClick="{{ nav.experiencia }}">Qual sabor combina com você?</button></li>
          <li><button type="button" onClick="{{ nav.sobre }}">Sobre nós</button></li>
          <li><button type="button" onClick="{{ nav.contato }}">Contato e newsletter</button></li>
        </ul>
      </div>
      <div>
        <h3>Redes (demonstrativas)</h3>
        <div class="social">
          <span class="soc"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"></rect><circle cx="12" cy="12" r="3.6"></circle><path d="M17 7.2h.01"></path></svg></i>@akari.cozinha</span>
          <span class="soc"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4"></rect><path d="M10.5 9.5v5l4-2.5z"></path></svg></i>AKARI Cozinha</span>
        </div>
      </div>
    </div>
    <div class="ftr-word" aria-hidden="true">AKARI</div>
    <div class="ftr-bot">
      <span>© 2026 AKARI — marca fictícia criada para demonstração.</span>
      <span>Ilustrações originais · Receitas de referência para uso doméstico</span>
    </div>
  </div>
</footer>

<sc-if value="{{ showTop }}" hint-placeholder-val="{{ false }}">
  <button class="totop" type="button" onClick="{{ toTop }}" aria-label="Voltar ao topo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</sc-if>

<!-- ============ MODAL RECEITA ============ -->
<sc-if value="{{ m.open }}" hint-placeholder-val="{{ false }}">
<div class="ovl" onClick="{{ m.backdrop }}" onKeyDown="{{ m.key }}">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <button class="xbtn" type="button" onClick="{{ m.close }}" aria-label="Fechar receita" ref="{{ m.closeRef }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div class="dlg-hero">
      <div class="ph"><img src="{{ m.r.img }}" alt="{{ m.r.alt }}" width="800" height="800" decoding="async"></div>
      <div class="dlg-hd">
        <p class="kicker">{{ m.r.countryName }} · {{ m.r.catLabel }}</p>
        <h2 id="dlg-t">{{ m.r.title }}</h2>
        <p class="lead">{{ m.r.desc }}</p>
        <div class="facts-row">
          <div><small>Tempo total</small><b>{{ m.r.timeLabel }}</b></div>
          <div><small>Rendimento</small><b>{{ m.r.yield }}</b></div>
          <div><small>Dificuldade</small><b>{{ m.r.diffLabel }}</b></div>
          <div><small>Etapas</small><b>{{ m.stepCount }}</b></div>
        </div>
      </div>
    </div>
    <div class="dlg-body">
      <div>
        <h3>Ingredientes</h3>
        <p class="sub">Toque para marcar o que já separou · {{ m.checkedCount }}/{{ m.ingCount }}</p>
        <ul class="ings">
          <sc-for list="{{ m.ings }}" as="i" hint-placeholder-count="8">
            <li><button class="ing {{ i.cls }}" type="button" onClick="{{ i.toggle }}" aria-pressed="{{ i.on }}"><span class="box" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span class="txt">{{ i.t }}</span></button></li>
          </sc-for>
        </ul>
      </div>
      <div>
        <h3>Modo de preparo</h3>
        <p class="sub">Toque em cada etapa ao concluí-la · {{ m.doneCount }}/{{ m.stepCount }}</p>
        <ol class="steps">
          <sc-for list="{{ m.steps }}" as="s" hint-placeholder-count="6">
            <li><button class="step {{ s.cls }}" type="button" onClick="{{ s.toggle }}" aria-pressed="{{ s.on }}"><span class="no">{{ s.n }}</span><p>{{ s.t }}</p></button></li>
          </sc-for>
        </ol>
        <div class="tipbox">
          <div class="tip chef"><small>Dica do chef</small><p>{{ m.r.tip }}</p></div>
          <div class="tip"><small>Sugestão de apresentação</small><p>{{ m.r.plating }}</p></div>
        </div>
      </div>
    </div>
    <div class="related">
      <p class="kicker">Você também pode gostar</p>
      <div class="rel-grid">
        <sc-for list="{{ m.related }}" as="r" hint-placeholder-count="3">
          <button class="rel" type="button" onClick="{{ r.open }}">
            <div class="ph"><img src="{{ r.img }}" alt="" width="800" height="800" loading="lazy"></div>
            <span><b>{{ r.title }}</b><small>{{ r.countryName }} · {{ r.timeLabel }}</small></span>
          </button>
        </sc-for>
      </div>
    </div>
    <div class="dlg-foot">
      <span>Receita de referência para uso doméstico. Ajuste sal e pimenta ao seu gosto.</span>
      <button class="btn sm ghost" type="button" onClick="{{ m.close }}"><span>Fechar receita</span></button>
    </div>
  </div>
</div>
</sc-if>

</div>
</template>

<script src="assets/js/vendor/react-18.production.min.js"></script>
<script src="assets/js/runtime.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
